[project]
name = "librejyotish"
version = "0.1.1"
description = "Deterministic Vedic (Jyotish) astrology computations exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
keywords = ["astrology", "jyotish", "vedic", "mcp", "ephemeris"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0.0",
    "pyswisseph>=2.10",
]

[project.urls]
Homepage = "https://github.com/anhadlamba30/librejyotish"
Repository = "https://github.com/anhadlamba30/librejyotish"
Issues = "https://github.com/anhadlamba30/librejyotish/issues"

[project.scripts]
librejyotish = "librejyotish.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["librejyotish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
