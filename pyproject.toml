[project]
name = "openjyotish"
version = "0.1.0"
description = "Deterministic Vedic (Jyotish) astrology computations exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
keywords = ["astrology", "jyotish", "vedic", "mcp", "ephemeris"]
dependencies = [
    "mcp>=2.0.0",
    "pyswisseph>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
