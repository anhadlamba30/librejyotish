name: release

# Cut a release by tagging: git tag v0.2.1 && git push origin v0.2.1
# The tag MUST match the version in pyproject.toml (checked below).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload dist artifacts
  id-token: write # PyPI trusted publishing (OIDC, no API token needed)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest build

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
